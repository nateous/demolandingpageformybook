<svg width="400" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Forest green background -->
  <rect width="400" height="600" fill="#228B22"/>
  
  <!-- Decorative border -->
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#90EE90" stroke-width="3"/>
  
  <!-- Inner decorative elements -->
  <rect x="40" y="40" width="320" height="520" fill="none" stroke="#90EE90" stroke-width="1" opacity="0.5"/>
  
  <!-- Title: Beyond the Numbers -->
  <text x="200" y="180" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Beyond the</text>
  <text x="200" y="240" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Numbers</text>
  
  <!-- Decorative line -->
  <line x1="80" y1="280" x2="320" y2="280" stroke="#90EE90" stroke-width="2"/>
  
  <!-- Subtitle -->
  <text x="200" y="400" font-family="Georgia, serif" font-size="24" fill="#90EE90" text-anchor="middle">Three Buckets</text>
  <text x="200" y="435" font-family="Georgia, serif" font-size="24" fill="#90EE90" text-anchor="middle">of Money</text>
  
  <!-- Decorative dollar symbols -->
  <text x="80" y="500" font-family="Arial, sans-serif" font-size="36" fill="#90EE90" opacity="0.3">$</text>
  <text x="200" y="520" font-family="Arial, sans-serif" font-size="36" fill="#90EE90" opacity="0.3">$</text>
  <text x="320" y="500" font-family="Arial, sans-serif" font-size="36" fill="#90EE90" opacity="0.3">$</text>
</svg>
